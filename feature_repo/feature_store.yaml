project: rossmann_project
provider: local
entity_key_serialization_version: 2

# FEAST CHANGE: Point registry to the SQL database instead of a local file
# path is explicitly postgresql+psycopg (not plain postgresql) to silence
# Feast's startup warning about which SQLAlchemy driver it defaults to.
registry:
  registry_type: sql
  path: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/feast

offline_store:
  type: postgres
  host: postgres
  port: 5432
  database: rossmann
  db_schema: public
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  sslmode: disable

online_store:
  type: redis
  connection_string: "redis:6379"