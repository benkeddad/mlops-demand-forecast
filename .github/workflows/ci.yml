name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        # Matches docker/api.Dockerfile's base image (bumped from 3.9, which
        # reached end-of-life in October 2025) - keeping these in sync is the
        # whole point; CI silently sitting on a different Python version than
        # what's actually shipped is exactly what let requirements.txt's
        # psycopg2-binary==2.9.0 pin go unnoticed for as long as it did.
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # evidently<0.7.0 unconditionally pulls in litestar, which
        # unconditionally requires the unrelated `multipart` PyPI package -
        # it clobbers python-multipart's same-named importable module on
        # disk (see docker/api.Dockerfile for the full explanation), which
        # crashes pytest collection on any router module using
        # UploadFile/File. Force python-multipart back after the main
        # install, regardless of which one the resolver installed last.
        pip uninstall -y multipart
        pip install --no-cache-dir --force-reinstall --no-deps python-multipart
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src app pipelines db --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Test with pytest
      run: |
        pytest -v