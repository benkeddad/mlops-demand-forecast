[pytest]
# Makes both repo-root-style imports (from src.features import build_features,
# used by app/main.py and monitoring/drift.py) and script-style imports
# (from data import split_data, used by src/train.py when DVC runs it directly,
# and from training_pipeline import ml_training_pipeline, used by
# pipelines/serve_deployment.py) resolve the same way pytest collects them.
pythonpath = . src pipelines
testpaths = tests
# Both filters below silence warnings that originate entirely inside
# prefect==2.14.21's own source (prefect/input/run_input.py,
# prefect/_internal/pydantic/v2_validated_func.py) - not this project's code.
# Prefect is pinned to 2.14.x deliberately (see requirements.txt: 2.14.21's
# server is what docker/prefect.Dockerfile ships, and flow.serve()'s
# deployment-creation schema isn't compatible across minor versions), so this
# can't be fixed by bumping Prefect. Scoped to the exact category + message so
# a real PydanticDeprecatedSince20 warning from this project's own code would
# still surface.
filterwarnings =
    ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
