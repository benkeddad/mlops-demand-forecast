services:
  # ==========================================
  # 1. Database & Feature Store Infrastructure
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: rossmann_postgres
    deploy:
      resources:
        limits:
          memory: 192M
    command: postgres -c shared_buffers=32MB -c max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ../db/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rossmann_network

  redis:
    image: redis:7-alpine
    container_name: rossmann_redis
    deploy:
      resources:
        limits:
          memory: 320M
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - rossmann_network

  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack-main
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - SERVICES=s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rossmann_network

  # ==========================================
  # 2. Orchestration & Tracking
  # ==========================================
  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    container_name: rossmann_mlflow
    deploy:
      resources:
        limits:
          memory: 1792M
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --workers 1
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --default-artifact-root s3://rossmann-mlflow-artifacts/mlflow-artifacts
        --allowed-hosts "*"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure:5
    networks:
      - rossmann_network

  prefect:
    build:
      context: ..
      dockerfile: docker/prefect.Dockerfile
    container_name: rossmann_prefect
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      - PREFECT_SQLALCHEMY_POOL_SIZE=2
      - PREFECT_SQLALCHEMY_MAX_OVERFLOW=3
    command: prefect server start --host 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:5
    networks:
      - rossmann_network

  # ==========================================
  # 3. Application Layer
  # ==========================================
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: rossmann_api
    deploy:
      resources:
        limits:
          memory: 2560M
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - mlflow_data:/mlflow
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/rossmann
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MODEL_URI=models:/Rossmann_XGBoost_Model/latest
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PREFECT_API_URL=http://prefect:4200/api
      - WATCHFILES_FORCE_POLLING=true
      - MLFLOW_S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    depends_on:
      - postgres
      - redis
      - mlflow
      - prefect
      - localstack
    networks:
      - rossmann_network

volumes:
  postgres_data:
  mlflow_data:

networks:
  rossmann_network:
    driver: bridge
