services:
  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --allowed-hosts "*"

  # Prefect Orchestration Server
  prefect:
    image: prefecthq/prefect:2.14-python3.10
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0

  # FastAPI Application
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      #- .:/app # Maps your local workspace to /app inside the container
      - mlflow_data:/mlflow # <--- FIX 2: Shared volume so the API can physically read the model artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PREFECT_API_URL=http://prefect:4200/api
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - mlflow
      - prefect
volumes:
  mlflow_data: