stages:
  ingest:
    cmd: python src/data.py
    deps:
      - src/data.py
    outs:
      - s3://rossmann-mlops-dvc-store/processed-data/clean_data.parquet:
          cache: false

  featurize:
    cmd: python src/features.py
    deps:
      - s3://rossmann-mlops-dvc-store/processed-data/clean_data.parquet
      - src/features.py
    outs:
      - s3://rossmann-mlops-dvc-store/processed-data/train_features.parquet:
          cache: false

  # Independent from `featurize` above - src/train.py and serving
  # (app/main.py, src/predict_initial.py) never read this output, only
  # src/train_optimal.py does. Same clean_data.parquet input, different
  # feature function (build_features_rich() vs build_features()).
  featurize_rich:
    cmd: python src/featurize_rich.py
    deps:
      - s3://rossmann-mlops-dvc-store/processed-data/clean_data.parquet
      - src/features.py
      - src/featurize_rich.py
    outs:
      - s3://rossmann-mlops-dvc-store/processed-data/train_features_rich.parquet:
          cache: false

  train:
    cmd: python src/train.py
    deps:
      - s3://rossmann-mlops-dvc-store/processed-data/train_features.parquet
      - src/train.py
    metrics:
      - metrics/train_metrics.json:
          cache: false

  # Independent of the stages above - never swept into a bare `dvc repro`
  # (this repo never runs one; every dvc repro call across the codebase
  # names an explicit stage - see pipelines/training_pipeline.py and
  # pipelines/optimal_training_pipeline.py). Only ever run via
  # `dvc repro train_optimal`, triggered by POST /trigger-optimal-training.
  train_optimal:
    cmd: python src/train_optimal.py
    deps:
      - s3://rossmann-mlops-dvc-store/processed-data/train_features_rich.parquet
      - src/train_optimal.py
      - params.yaml
    metrics:
      - metrics/train_optimal_metrics.json:
          cache: false