stages:
  ingest:
    cmd: python src/data.py
    deps:
      - src/data.py
    outs:
      - data/processed/clean_data.parquet

  featurize:
    cmd: python src/features.py
    deps:
      - data/processed/clean_data.parquet
      - src/features.py
    outs:
      - data/processed/train_features.parquet

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train_features.parquet
      - src/train.py